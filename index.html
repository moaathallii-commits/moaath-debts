<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دفتر ديون متجر معاذ - الإصدار الجديد</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="manifest" href="manifest.json">
    <script>
        tailwind.config = {
            theme: {
                extend: { colors: { darkBg: '#0f172a', goldAccent: '#f59e0b', successGreen: '#10b981' } }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .pulse-red { animation: pulseRed 1.5s infinite; }
        @keyframes pulseRed { 0% { box-shadow: 0 0 0 0 rgba(239,68,68,0.7); } 70% { box-shadow: 0 0 0 10px rgba(239,68,68,0); } 100% { box-shadow: 0 0 0 0 rgba(239,68,68,0); } }
    </style>
</head>
<body class="min-h-screen flex flex-col">
    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 p-4 shadow-lg flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-gradient-to-tr from-goldAccent to-amber-300 rounded-xl flex items-center justify-center text-darkBg font-black text-xl">M</div>
            <div>
                <h1 class="font-bold text-goldAccent text-lg leading-tight">متجر معاذ</h1>
                <p class="text-xs text-slate-400">النظام المالي المحدث</p>
            </div>
        </div>
        <div id="user-controls" class="hidden flex gap-2">
            <span id="user-badge" class="bg-slate-700 text-goldAccent px-3 py-1 rounded-lg text-xs font-bold flex items-center"></span>
            <button onclick="logout()" class="text-red-400 hover:text-red-300"><i class="fa-solid fa-power-off"></i></button>
        </div>
    </header>

    <main class="flex-grow p-4 max-w-7xl mx-auto w-full">
        <!-- Login Section -->
        <section id="login-section" class="max-w-sm mx-auto mt-10 bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl">
            <h2 class="text-center text-xl font-bold text-white mb-6"><i class="fa-solid fa-lock text-goldAccent mb-2 text-3xl block"></i> تسجيل الدخول</h2>
            <form id="login-form" class="space-y-4">
                <input type="text" id="phone" placeholder="رقم الهاتف (09...)" required class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm focus:border-goldAccent outline-none text-white">
                <input type="password" id="password" placeholder="كلمة المرور" required class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm focus:border-goldAccent outline-none text-white">
                <button type="submit" class="w-full bg-goldAccent text-darkBg font-bold py-3 rounded-xl hover:bg-amber-400 transition">دخول</button>
            </form>
        </section>

        <!-- Admin Panel -->
        <section id="admin-panel" class="hidden space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="bg-slate-800 p-4 rounded-2xl border border-slate-700">
                    <p class="text-xs text-slate-400 mb-1">الديون في السوق</p>
                    <h3 class="text-xl font-bold text-successGreen" id="admin-receivables">$0.00</h3>
                </div>
                <div class="bg-slate-800 p-4 rounded-2xl border border-slate-700">
                    <p class="text-xs text-slate-400 mb-1">ديون الموردين</p>
                    <h3 class="text-xl font-bold text-red-400" id="admin-payables">$0.00</h3>
                </div>
            </div>
            <div class="bg-slate-800 p-4 rounded-2xl border border-slate-700">
                <h3 class="font-bold text-goldAccent mb-4"><i class="fa-solid fa-users"></i> إدارة الزبائن والموردين</h3>
                <p class="text-xs text-slate-400 mb-4">تم بناء الهيكلة من الصفر. هنا يتم ربط دوال الفايربيس للإضافة والتعديل.</p>
            </div>
        </section>

        <!-- Customer Panel -->
        <section id="customer-panel" class="hidden space-y-6">
            <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 relative overflow-hidden">
                <h2 class="text-3xl font-black text-white" id="cust-balance">$0.00</h2>
                <p class="text-xs text-slate-400 mt-1">الرصيد الحالي</p>
                
                <div class="mt-4 pt-4 border-t border-slate-700">
                    <div class="flex justify-between text-xs mb-1">
                        <span class="text-slate-400">استهلاك السقف</span>
                        <span id="cust-limit-text" class="font-bold text-white">0%</span>
                    </div>
                    <div class="w-full bg-slate-900 rounded-full h-2">
                        <div id="cust-limit-bar" class="bg-successGreen h-full rounded-full" style="width: 0%"></div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // إعدادات Firebase
        const firebaseConfig = {
            databaseURL: "https://moaath-store-debts-default-rtdb.firebaseio.com/"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const ADMIN_PHONE = "0965461504";

        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const phone = document.getElementById('phone').value;
            const pass = document.getElementById('password').value;
            
            if (phone === ADMIN_PHONE) {
                localStorage.setItem('moaath_user', JSON.stringify({role: 'admin', name: 'الإدارة'}));
                checkAuth();
            } else {
                alert("جاري الاتصال بقاعدة البيانات للتحقق من حساب الزبون...");
            }
        });

        window.logout = () => {
            localStorage.removeItem('moaath_user');
            checkAuth();
        };

        function checkAuth() {
            const user = JSON.parse(localStorage.getItem('moaath_user'));
            const loginSec = document.getElementById('login-section');
            const adminSec = document.getElementById('admin-panel');
            const custSec = document.getElementById('customer-panel');
            const userControls = document.getElementById('user-controls');
            const userBadge = document.getElementById('user-badge');

            loginSec.classList.add('hidden');
            adminSec.classList.add('hidden');
            custSec.classList.add('hidden');

            if (!user) {
                loginSec.classList.remove('hidden');
                userControls.classList.add('hidden');
            } else {
                userControls.classList.remove('hidden');
                userBadge.textContent = user.name;
                if (user.role === 'admin') adminSec.classList.remove('hidden');
                else custSec.classList.remove('hidden');
            }
        }
        checkAuth();
        
        // PWA Installation
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(console.error);
        }
    </script>
</body>
                        </html>
