<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دفتر ديون متجر معاذ - يعمل بدون إنترنت</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <script>
        tailwind.config = {
            theme: {
                extend: { colors: { darkBg: '#0f172a', goldAccent: '#f59e0b', successGreen: '#10b981' } }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .pulse-red { animation: pulseRed 1.5s infinite; }
        @keyframes pulseRed { 0% { box-shadow: 0 0 0 0 rgba(239,68,68,0.7); } 70% { box-shadow: 0 0 0 10px rgba(239,68,68,0); } 100% { box-shadow: 0 0 0 0 rgba(239,68,68,0); } }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- مؤشر حالة الاتصال (متصل / بدون إنترنت) -->
    <div id="offline-banner" class="hidden bg-amber-500 text-darkBg text-center text-xs font-bold py-1 px-4">
        <i class="fa-solid fa-triangle-exclamation"></i> أنت تعمل حالياً بدون إنترنت (البيانات محفوظة ومزامنتها تلقائية عند الاتصال)
    </div>

    <header class="bg-slate-800/80 backdrop-blur border-b border-slate-700 p-4 shadow-lg flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-gradient-to-tr from-goldAccent to-amber-300 rounded-xl flex items-center justify-center text-darkBg font-black text-xl">M</div>
            <div>
                <h1 class="font-bold text-goldAccent text-lg leading-tight">متجر معاذ</h1>
                <p class="text-xs text-slate-400">يعمل دون انترنت (Offline)</p>
            </div>
        </div>
        <div id="user-controls" class="hidden flex gap-2 items-center">
            <span id="user-badge" class="bg-slate-700 text-goldAccent px-3 py-1 rounded-lg text-xs font-bold"></span>
            <button onclick="logout()" class="text-red-400 hover:text-red-300"><i class="fa-solid fa-power-off"></i></button>
        </div>
    </header>

    <main class="flex-grow p-4 max-w-7xl mx-auto w-full">
        <section id="login-section" class="max-w-sm mx-auto mt-12 bg-slate-800 p-6 rounded-3xl border border-slate-700 shadow-xl">
            <h2 class="text-center text-xl font-bold text-white mb-6"><i class="fa-solid fa-lock text-goldAccent mb-2 text-3xl block"></i> تسجيل الدخول</h2>
            <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
                <input type="text" id="phone" placeholder="رقم الهاتف (09...)" required class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white focus:border-goldAccent outline-none">
                <input type="password" id="password" placeholder="كلمة المرور" required class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white focus:border-goldAccent outline-none">
                <button type="submit" class="w-full bg-goldAccent text-darkBg font-bold py-3 rounded-xl hover:bg-amber-400 transition">دخول</button>
            </form>
        </section>

        <section id="admin-panel" class="hidden space-y-6">
            <div class="bg-slate-800 p-6 rounded-3xl border border-slate-700">
                <h3 class="font-bold text-goldAccent text-lg mb-2"><i class="fa-solid fa-shield-halved"></i> لوحة الإدارة (متصل محلياً)</h3>
                <p class="text-xs text-slate-400">يمكنك تسجيل الديون والعمليات حتى وإن كان الجهاز مقطوعاً عن الإنترنت تماماً.</p>
            </div>
        </section>

        <section id="customer-panel" class="hidden space-y-6">
            <div class="bg-slate-800 p-6 rounded-3xl border border-slate-700">
                <h3 class="font-bold text-goldAccent text-lg mb-2" id="cust-welcome"></h3>
                <p class="text-xs text-slate-400">عرض رصيدك وسجل حركاتك بدون الحاجة للاتصال بالشبكة.</p>
            </div>
        </section>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, enableIndexedDbPersistence } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            databaseURL: "https://moaath-store-debts-default-rtdb.firebaseio.com/"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // تفعيل ميزة العمل بدون انترنت والتخزين المحلي المؤقت في المتصفح (IndexedDB)
        enableIndexedDbPersistence(db).catch((err) => {
            if (err.code == 'failed-precondition') {
                console.log('مفتوح في عدة نوافذ، لا يمكن تفعيل الحفظ المحلي في نفس الوقت.');
            } else if (err.code == 'unimplemented') {
                console.log('المتصفح لا يدعم ميزة التخزين المحلي للبيانات.');
            }
        });

        window.firebaseDB = { db, ref, onValue };

        // مراقبة حالة الاتصال بالإنترنت
        window.addEventListener('online', updateOnlineStatus);
        window.addEventListener('offline', updateOnlineStatus);
        function updateOnlineStatus() {
            const banner = document.getElementById('offline-banner');
            if (!navigator.onLine) {
                banner.classList.remove('hidden');
            } else {
                banner.classList.add('hidden');
            }
        }
        updateOnlineStatus();

        const ADMIN_PHONE = "0965461504";

        window.handleLogin = function(e) {
            e.preventDefault();
            const phone = document.getElementById('phone').value.trim();
            const pass = document.getElementById('password').value.trim();

            if (phone === ADMIN_PHONE) {
                localStorage.setItem('moaath_user', JSON.stringify({role: 'admin', name: 'معاذ العلي', phone}));
                checkAuth();
            } else {
                localStorage.setItem('moaath_user', JSON.stringify({role: 'customer', name: 'زبون المتجر', phone}));
                checkAuth();
            }
        };

        window.logout = function() {
            localStorage.removeItem('moaath_user');
            checkAuth();
        };

        function checkAuth() {
            const user = JSON.parse(localStorage.getItem('moaath_user'));
            const loginSec = document.getElementById('login-section');
            const adminSec = document.getElementById('admin-panel');
            const custSec = document.getElementById('customer-panel');
            const userControls = document.getElementById('user-controls');
            const userBadge = document.getElementById('user-badge');

            loginSec.classList.add('hidden');
            adminSec.classList.add('hidden');
            custSec.classList.add('hidden');

            if (!user) {
                loginSec.classList.remove('hidden');
                userControls.classList.add('hidden');
            } else {
                userControls.classList.remove('hidden');
                userBadge.textContent = user.name;
                if (user.role === 'admin') adminSec.classList.remove('hidden');
                else {
                    custSec.classList.remove('hidden');
                    document.getElementById('cust-welcome').textContent = `مرحباً بك، ${user.name}`;
                }
            }
        }
        checkAuth();
    </script>
</body>
</html>
